name: tests

# Public check. No API keys and no repository secrets.
# The suite drives the real API with a scripted LLM (tests/fake_llm.py).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Test without an API key
        run: pytest -q
